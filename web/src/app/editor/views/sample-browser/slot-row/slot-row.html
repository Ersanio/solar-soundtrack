@let slot = row().slot;
<span class="text-ink-muted w-6 shrink-0 text-right font-mono text-xs tabular-nums">
  {{ slot.index | hex2 }}
</span>

@if (row().used) {
  <span
    i18n="@@samples.used"
    class="bg-good/20 text-good shrink-0 rounded-md px-1 py-px text-[11px] font-semibold tracking-wide uppercase"
    i18n-title="@@samples.this-song-plays-this.title-2"
    title="samples.this-song-plays-this.title-2"
    >samples.used</span
  >
}

<amk-audition-button [name]="slot.name" [disabled]="slot.empty" />

<div class="min-w-0 flex-1">
  @if (slot.empty) {
    <p i18n="@@samples.empty-slot" class="text-ink-muted font-mono text-xs">samples.empty-slot</p>
  } @else {
    <amk-sample-wave class="h-6" [d]="row().waveform" />
    <p class="text-ink-muted mt-0.5 font-mono text-xs">{{ row().detail }}</p>
  }
</div>

<span class="text-ink-muted shrink-0 font-mono text-xs tabular-nums">{{ row().size }}</span>

@if (row().requested) {
  <amk-checkbox
    i18n="@@samples.keep"
    class="shrink-0 text-xs"
    [checked]="slot.important"
    (checkedChange)="onImportant(slot.name, $event)"
    >samples.keep</amk-checkbox
  >
} @else {
  <span
    i18n="@@samples.not-in-song"
    class="text-ink-muted shrink-0 text-xs"
    i18n-title="@@samples.this-song-does-not.title-2"
    title="samples.this-song-does-not.title-2"
    >samples.not-in-song</span
  >
}
