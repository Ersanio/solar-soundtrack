<amk-toolbar>
  <button
    amk-toggle
    icon
    [pressed]="wordWrap()"
    [title]="wordWrap() ? 'Word wrap: on' : 'Word wrap: off'"
    (click)="toggleWordWrap()"
  >
    <amk-icon-wrap />
  </button>

  <!-- The same pair the roll's toolbar carries. -->
  <amk-history-buttons />

  <span class="bg-edge h-5 w-px shrink-0"></span>

  <!-- The switch on the toolbar and the palette below it: a closed palette would
       otherwise be one row of chrome that still had to be drawn. The chevron
       says which way it is. -->
  <button
    amk-toggle
    [pressed]="paletteOpen()"
    [title]="paletteOpen() ? 'Hide the command palette' : 'Show the command palette'"
    (click)="paletteOpen.set(!paletteOpen())"
  >
    @if (paletteOpen()) {
      <amk-icon-chevron-down />
    } @else {
      <amk-icon-chevron-right />
    }
    Commands
  </button>

  <span class="text-ink-muted ml-auto font-mono text-xs">{{ store.caretLabel() }}</span>
</amk-toolbar>

<!-- Above the editor rather than beside it: what it writes lands at the caret,
     and it reads the dialect there, so it belongs to the text below. Built only
     while this view is showing. -->
@if (active() && paletteOpen()) {
  <amk-command-palette />
}

<div class="min-h-0 flex-1">
  <div #editorHost class="h-full"></div>
</div>
