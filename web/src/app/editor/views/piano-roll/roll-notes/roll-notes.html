@for (mark of shown(); track mark.id) {
  <!-- A click asks the inspector about this note; a double click goes to it in
       the source. A muted note takes no pointer at all, so the live note over it
       is the one that answers.

       No cursor of its own, here or on the glyph plates below: an element's own
       `cursor` beats the one it inherits, and the roll's `<svg>` carries the one
       that says which gesture a press starts. -->
  <svg:g
    class="mark"
    [class.pointer-events-none]="mark.muted"
    (pointerenter)="entered.emit(mark)"
    (click)="select(mark)"
    (dblclick)="reveal(mark)"
    (keydown.enter)="reveal(mark)"
  >
    <!-- A selected note is outlined rather than recoloured: the eight channel
         colours are the one thing a bar always says, and a selection that took
         one of them away would be a selection that renamed the channel. -->
    @if (selected().has(mark.note.address)) {
      <svg:rect
        rx="3"
        fill="none"
        class="stroke-ink"
        stroke-width="1.5"
        [attr.x]="mark.x - 1"
        [attr.y]="mark.y - 1"
        [attr.width]="mark.w + 2"
        [attr.height]="mark.h + 2"
      />
    }
    <!-- The slot, then the part that actually sounds. The inner bar is `q`'s
         gate made geometric rather than written down. -->
    <svg:rect
      rx="2"
      [attr.x]="mark.x"
      [attr.y]="mark.y"
      [attr.width]="mark.w"
      [attr.height]="mark.h"
      [class]="mark.fill"
      [attr.fill-opacity]="mark.opacity * 0.35"
    />
    <svg:rect
      rx="2"
      [attr.x]="mark.x"
      [attr.y]="mark.y"
      [attr.width]="mark.gateW"
      [attr.height]="mark.h"
      [class]="mark.fill"
      [attr.fill-opacity]="mark.opacity"
    />
    @if (mark.label; as label) {
      <svg:text
        pointer-events="none"
        dominant-baseline="central"
        class="fill-ink font-mono"
        [attr.x]="label.x"
        [attr.y]="label.y"
        [attr.font-size]="label.size"
        [attr.fill-opacity]="mark.opacity"
      >
        {{ label.text }}
      </svg:text>
    }
    <!-- The plate is the hit target as well as the highlight. An SVG element
         only takes a pointer where it is painted, so without it a glyph is
         clickable on its strokes and not in the gaps between them — a 1.3px
         target that reads as a dead icon.

         It lifts the bar rather than recolouring the glyph, because it is drawn
         over eight channel colours and only the plate works on all of them:
         `--color-accent` is a blue of much the same lightness as `--color-ch-0`,
         so on that channel a recoloured glyph would be the one that vanished on
         hover. Every `--color-ch-*` is mid-tone against the surface, so a
         near-white wash lifts each of them. -->
    @for (glyph of mark.glyphs; track glyph.id) {
      <svg:g
        class="group"
        (click)="inspect(mark, glyph, $event)"
        (dblclick)="inspect(mark, glyph, $event, true)"
      >
        <svg:rect
          rx="2"
          class="fill-ink/0 group-hover:fill-ink/25"
          [attr.x]="glyph.x"
          [attr.y]="glyph.y"
          [attr.width]="glyph.size"
          [attr.height]="glyph.size"
        />
        <!-- No `svg:` prefix on this one, and it must not have one: `svg` is one
             of the three element names that carry a namespace implicitly, and the
             glyph's selector is `svg[amk-glyph]`. -->
        <svg
          amk-glyph
          class="text-ink pointer-events-none"
          [name]="glyph.icon"
          [attr.x]="glyph.x"
          [attr.y]="glyph.y"
          [attr.width]="glyph.size"
          [attr.height]="glyph.size"
          [attr.opacity]="mark.opacity"
        ></svg>
      </svg:g>
    }
    <!-- The commands the bar had no room for, on the same plate as a glyph so
         it reads as one of the row. Not a glyph out of the palette, though: it
         stands for a list rather than a command, so it has no span to reveal
         and no handler of its own — the plate is there to be lit, and the click
         it does not stop reaches the bar, whose answer is the whole list. -->
    @if (mark.more; as more) {
      <svg:g class="group">
        <svg:rect
          rx="2"
          class="fill-ink/0 group-hover:fill-ink/25"
          [attr.x]="more.x"
          [attr.y]="more.y"
          [attr.width]="more.size"
          [attr.height]="more.size"
        />
        <svg:g
          class="fill-ink pointer-events-none"
          [attr.fill-opacity]="mark.opacity"
          [attr.transform]="`translate(${more.x} ${more.y})`"
        >
          <svg:circle
            [attr.cx]="more.size * 0.26"
            [attr.cy]="more.size / 2"
            [attr.r]="more.size * 0.07"
          />
          <svg:circle
            [attr.cx]="more.size * 0.5"
            [attr.cy]="more.size / 2"
            [attr.r]="more.size * 0.07"
          />
          <svg:circle
            [attr.cx]="more.size * 0.74"
            [attr.cy]="more.size / 2"
            [attr.r]="more.size * 0.07"
          />
        </svg:g>
      </svg:g>
    }
  </svg:g>
}
