<span i18n="@@roll.on-percussion-lanes" class="text-ink-muted text-xs"
  >roll.on-percussion-lanes</span
>
@for (chip of chips(); track chip.instrument) {
  <button
    amk-toggle
    size="sm"
    class="font-mono"
    [pressed]="chip.on"
    [title]="chip.title"
    (click)="toggled.emit(chip.instrument)"
  >
    {{ chip.label }}
  </button>
} @empty {
  <span i18n="@@roll.this-song-plays-no" class="text-ink-muted text-xs"
    >roll.this-song-plays-no</span
  >
}
<button
  i18n="@@roll.reset"
  amk-button
  variant="ghost"
  size="sm"
  class="ml-auto"
  [disabled]="!hasOverrides()"
  (click)="resetAll.emit()"
>
  roll.reset
</button>
