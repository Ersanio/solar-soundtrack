<span class="text-ink-muted text-xs">On percussion lanes</span>
@for (chip of chips(); track chip.instrument) {
  <button
    amk-toggle
    size="sm"
    class="font-mono"
    [pressed]="chip.on"
    [title]="chip.title"
    (click)="toggled.emit(chip.instrument)"
  >
    {{ chip.label }}
  </button>
} @empty {
  <span class="text-ink-muted text-xs">This song plays no instruments.</span>
}
<button
  amk-button
  variant="ghost"
  size="sm"
  class="ml-auto"
  [disabled]="!hasOverrides()"
  (click)="resetAll.emit()"
>
  Reset
</button>
