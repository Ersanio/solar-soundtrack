<amk-toolbar>
  <!-- First, and ahead of every setting: one history, so a roll gesture and a
       keystroke undo in the order they happened, and the roll is where a
       gesture is most easily made by accident. The source toolbar carries the
       same pair. -->
  <amk-history-buttons />

  <span class="bg-edge h-5 w-px shrink-0"></span>

  <div class="flex items-center gap-1">
    <span class="text-ink-muted text-xs">Zoom</span>
    <button amk-button size="sm" icon title="Zoom out" (click)="zoomBy.emit(-1)">
      <amk-icon-minus />
    </button>
    <button amk-button size="sm" icon title="Zoom in" (click)="zoomBy.emit(1)">
      <amk-icon-plus />
    </button>
  </div>

  <div class="flex items-center gap-1">
    <span class="text-ink-muted text-xs">Rows</span>
    <button amk-button size="sm" icon title="Shorter rows" (click)="rowHeightBy.emit(-1)">
      <amk-icon-minus />
    </button>
    <button amk-button size="sm" icon title="Taller rows" (click)="rowHeightBy.emit(1)">
      <amk-icon-plus />
    </button>
  </div>

  <span class="bg-edge h-5 w-px shrink-0"></span>

  <!-- Three ways of looking at the roll, each a lit plate while it is on. -->
  <button
    amk-toggle
    title="Keep the roll on the playing song, including after a scroll seeks it"
    [pressed]="follow()"
    (click)="followChange.emit(!follow())"
  >
    Follow playback
  </button>
  <button
    amk-toggle
    title="Slide the music under a fixed playhead, rather than turning a page when the playhead reaches the edge"
    [pressed]="scrollNotes()"
    (click)="scrollNotesChange.emit(!scrollNotes())"
  >
    Scroll the notes
  </button>
  <button amk-toggle [pressed]="allOctaves()" (click)="allOctavesChange.emit(!allOctaves())">
    All octaves
  </button>

  <span class="bg-edge h-5 w-px shrink-0"></span>

  <!-- Beats per bar over the note value that gets the beat, which is an MML note
       length: 6/8 is six `l8`s. MML has no signature of its own, so this is the
       porter's. -->
  <div
    class="flex items-center gap-1"
    title="The grid's time signature: beats in a bar, over the note that gets the beat. Zero beats draws no grid."
  >
    <span class="text-ink-muted text-xs">Grid</span>
    <input
      type="number"
      class="bg-inset border-edge text-ink h-7 w-12 rounded-md border px-1.5 font-mono text-xs tabular-nums"
      min="0"
      step="1"
      [max]="maxBeats"
      [value]="beatsPerBar()"
      (change)="setBeatsPerBar($event)"
    />
    <span class="text-ink-muted text-xs">/</span>
    <select
      class="bg-inset border-edge text-ink h-7 cursor-pointer rounded-md border px-1.5 font-mono text-xs tabular-nums"
      [value]="beatUnit()"
      (change)="setBeatUnit($event)"
    >
      @for (unit of beatUnits; track unit) {
        <option [value]="unit" [selected]="unit === beatUnit()">{{ unit }}</option>
      }
    </select>
  </div>

  <!-- What a drawn or dragged note lands on. Its own control rather than the
       grid's beat, because the grid is the lines you want to see and at 4/4
       that is a whole quarter note. Alt gives ticks without changing it. -->
  <div
    class="flex items-center gap-1"
    title="What a note snaps to when you draw or drag it. Hold Alt for single ticks."
  >
    <span class="text-ink-muted text-xs">Snap</span>
    <select
      class="bg-inset border-edge text-ink h-7 cursor-pointer rounded-md border px-1.5 text-xs"
      [value]="snap()"
      (change)="setSnap($event)"
    >
      @for (name of snaps; track name) {
        <option [value]="name" [selected]="name === snap()">{{ snapLabels[name] }}</option>
      }
    </select>
  </div>

  <!-- One rule for every gesture that could make two notes sound at once, so a
       drag and a stretch answer an overlap the same way. The inspector's own
       length slider is not the roll and does not read this. -->
  <div
    class="flex items-center gap-1"
    title="What happens when notes overlap: Overwrite takes the ticks off the notes already there, Insert shifts them out of the way, Strict refuses the edit."
  >
    <span class="text-ink-muted text-xs">Edits</span>
    <select
      class="bg-inset border-edge text-ink h-7 cursor-pointer rounded-md border px-1.5 text-xs"
      [value]="editMode()"
      (change)="setEditMode($event)"
    >
      @for (name of editModes; track name) {
        <option [value]="name" [selected]="name === editMode()">
          {{ editModeLabels[name] }}
        </option>
      }
    </select>
  </div>

  <span class="bg-edge h-5 w-px shrink-0"></span>

  <!-- The switch on the toolbar and the panel below it, as the source view does
       for the command palette: a closed strip would otherwise be one row of
       chrome that still had to be drawn. The chevron says which way it is. -->
  <button
    amk-toggle
    [pressed]="percussionOpen()"
    [title]="
      percussionOpen() ? 'Hide the percussion set' : 'Choose which instruments are percussion'
    "
    (click)="percussionOpenChange.emit(!percussionOpen())"
  >
    @if (percussionOpen()) {
      <amk-icon-chevron-down />
    } @else {
      <amk-icon-chevron-right />
    }
    Percussion
  </button>

  <span class="ml-auto flex items-center gap-3 font-mono text-xs">
    @if (selectedLabel(); as label) {
      <span class="text-ink-muted">{{ label }}</span>
    }
    <!-- Why a channel cannot be edited is said here rather than in a dialog: it
         is a property of the song, or of the mixer for a muted channel, and not
         the answer to a click. -->
    @if (editRefusal(); as reason) {
      <span class="text-warn">cannot edit: {{ reason }}</span>
    }
    <!-- And why the last gesture was not written out. A refusal the plan
         carries is on show while the pointer is down, beside the red bars saying
         the same thing; one the splice makes arrives at the pointer-up that
         undoes the gesture, so it stands until the document moves under it. -->
    @if (gestureRefusal(); as reason) {
      <span class="text-warn">refused: {{ reason }}</span>
    }
  </span>
</amk-toolbar>
