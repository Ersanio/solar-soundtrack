<!-- One box per pass, around the rows its notes span, washed in the channel's
     own colour — solid-ish at the declaration, a fainter ghost on a repeat.
     The edge says the same thing: dashed where the text is, dotted where it
     plays again. -->

@for (region of regions(); track region.id) {
  <svg:rect
    rx="3"
    stroke-width="1"
    [class]="`${region.fill} pointer-events-none stroke-ink-muted`"
    [attr.stroke-dasharray]="region.declared ? '4 3' : '1 3'"
    [attr.x]="region.x + 0.5"
    [attr.y]="region.y"
    [attr.width]="region.w - 1"
    [attr.height]="region.h"
    [attr.fill-opacity]="region.tint"
    [attr.stroke-opacity]="region.opacity"
  />
  <!-- The edge as a handle: a wide transparent stroke over the same box, so
       the dashed or dotted line is grabbable without pixel-hunting. It takes
       the pointer only on the stroke — the box's inside stays the grid's and
       the bars', which are drawn above it. A press here selects the body's
       whole group, and a drag slides this pass along the song
       (`roll-gesture.ts`); a silenced channel's edge takes no pointer, as its
       bars do not. -->
  <svg:rect
    rx="3"
    fill="none"
    stroke="transparent"
    stroke-width="9"
    class="loop-edge"
    [attr.pointer-events]="region.opacity === 1 ? 'stroke' : 'none'"
    [attr.data-channel]="region.channel"
    [attr.data-body]="region.body"
    [attr.data-tick]="region.tick"
    [attr.x]="region.x + 0.5"
    [attr.y]="region.y"
    [attr.width]="region.w - 1"
    [attr.height]="region.h"
  />
}
