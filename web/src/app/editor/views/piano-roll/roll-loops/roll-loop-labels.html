<!-- A near-white plate with the loop's number in the surface colour: a pairing
     that carries its own contrast, so it reads whatever the box's wash and the
     bar standing under it happen to be. -->

@for (label of labels(); track label.id) {
  <svg:rect
    rx="2"
    class="fill-ink"
    [attr.x]="label.x"
    [attr.y]="label.y"
    [attr.width]="label.w"
    [attr.height]="label.h"
  />
  <svg:text
    text-anchor="middle"
    dominant-baseline="central"
    class="fill-surface font-mono tabular-nums"
    [attr.x]="label.textX"
    [attr.y]="label.textY"
    [attr.font-size]="size"
  >
    {{ label.text }}
  </svg:text>
}
