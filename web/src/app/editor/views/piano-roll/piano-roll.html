<amk-roll-toolbar
  [follow]="follow()"
  [scrollNotes]="scrollNotes()"
  [allOctaves]="allOctaves()"
  [beatsPerBar]="beatsPerBar()"
  [beatUnit]="beatUnit()"
  [percussionOpen]="percussionOpen()"
  [editChannel]="editChannel()"
  [tick]="readoutTick()"
  [snap]="snap()"
  [editMode]="editMode()"
  [editRefusal]="editRefusal()"
  [selected]="gestures.selection().size"
  (zoomBy)="setZoom($event)"
  (snapChange)="setSnap($event)"
  (editModeChange)="setEditMode($event)"
  (rowHeightBy)="setRowHeight($event)"
  (followChange)="setFollow($event)"
  (scrollNotesChange)="setScrollNotes($event)"
  (allOctavesChange)="setAllOctaves($event)"
  (beatsPerBarChange)="setBeatsPerBar($event)"
  (beatUnitChange)="setBeatUnit($event)"
  (percussionOpenChange)="setPercussionOpen($event)"
/>

@if (percussionOpen()) {
  <amk-percussion-panel
    [chips]="chips()"
    [hasOverrides]="hasPercussionOverrides()"
    (toggled)="togglePercussion($event)"
    (resetAll)="resetPercussion()"
  />
}

@if (problems().length > 0) {
  <ul class="border-edge text-warn border-b px-3 py-2 text-xs leading-relaxed">
    @for (problem of problems(); track problem) {
      <li>{{ problem }}</li>
    }
  </ul>
}

<!-- The scrub bar: the whole song at once, and the drag that seeks it. Outside
     the roll's own scroller on purpose — a scrubber that scrolled out of view
     would be gone exactly when a tall song most needs it.

     The channel picker sits over the corner the bar leaves empty, inside the
     same `@if` so the corner arrives with the bar it is a corner of. -->
@if (scrubBox(); as box) {
  <div class="relative shrink-0">
    <amk-roll-scrub
      [box]="box"
      [rollWidth]="rollWidth()"
      [ticks]="songTicks()"
      [bars]="minimap()"
      [playheadX]="scrubX()"
      [viewWindow]="scrubWindow()"
      (scrubStart)="onScrubStart()"
      (scrubTo)="onScrubTo($event)"
      (scrubEnd)="onScrubEnd()"
    />

    <amk-roll-channels [selected]="editChannel()" (picked)="setEditChannel($event)" />
  </div>
}

<div
  #viewport
  class="relative min-h-0 flex-1 overflow-x-hidden overflow-y-auto"
  (pointermove)="onMove($event)"
  (pointerleave)="leave()"
  (wheel)="onWheel($event)"
  (scroll)="onViewportScroll()"
>
  @if (viewBox(); as box) {
    <!-- `select-none`: a double click on a bar must not drag a text selection
         out of the labels drawn inside it.

         The pointer handlers are on the `<svg>` rather than on the scroller
         around it, so a gesture measures against a box that scrolls with the
         notes and needs no scroll offset undone. -->
    <svg
      class="block w-full select-none"
      [attr.height]="stackHeight()"
      [attr.viewBox]="box"
      [style.cursor]="gestures.cursor()"
      (pointerdown)="onEditDown($event)"
      (pointermove)="onEditMove($event)"
      (pointerup)="onEditUp($event)"
      (pointercancel)="onEditUp($event)"
      (pointerleave)="onEditLeave()"
      (contextmenu)="onContextMenu($event)"
    >
      <defs>
        <clipPath id="amk-roll-clip">
          <rect
            y="0"
            [attr.x]="keyWidth"
            [attr.width]="rollWidth()"
            [attr.height]="stackHeight()"
          />
        </clipPath>
      </defs>

      <g
        amk-roll-lanes
        [lanes]="lanes()"
        [rowHeight]="rowHeight()"
        [width]="width()"
        [held]="heldRows()"
      />

      <g clip-path="url(#amk-roll-clip)">
        <!-- The frame clock reaches exactly this far. Both children below take
             the mark window's cadence instead, so neither is re-checked per
             frame just because the music has moved a pixel. -->
        <g [attr.transform]="scroll()">
          <g
            amk-roll-grid
            [lines]="lines()"
            [height]="stackHeight()"
            [loopX]="loopX()"
            [endX]="endX()"
          />
          <g
            amk-roll-notes
            [marks]="marks()"
            [selected]="selectedSpans()"
            (entered)="enter($event)"
            (channelPicked)="selectEditChannel($event)"
          />
          <g
            amk-roll-edit
            [preview]="gestures.preview()"
            [marquee]="gestures.marquee()"
            [ghost]="gestures.ghost()"
            [bubble]="gestures.bubble()"
            [fill]="editFill()"
            [stroke]="editStroke()"
            [blocked]="blocked()"
          />
        </g>

        <line
          y1="0"
          class="stroke-accent"
          stroke-width="1.5"
          [attr.x1]="playheadX()"
          [attr.x2]="playheadX()"
          [attr.y2]="stackHeight()"
        />
      </g>

      <g
        amk-roll-keys
        [lanes]="lanes()"
        [rowHeight]="rowHeight()"
        [height]="stackHeight()"
        [held]="heldRows()"
        [showLabels]="showLabels()"
        [labelSize]="labelSize()"
        [playable]="editChannel() !== null"
        (pressed)="onKeyPress($event)"
      />
    </svg>
  }
</div>

@if (!gestures.busy() && tooltipFor(); as mark) {
  <amk-roll-tooltip [mark]="mark" [anchor]="pointer()" [context]="placeContext()" />
}
