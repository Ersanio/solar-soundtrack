@for (line of lines(); track line.tick) {
  <svg:line
    y1="0"
    class="stroke-edge"
    stroke-width="1"
    [attr.x1]="line.x"
    [attr.x2]="line.x"
    [attr.y2]="height()"
    [attr.stroke-opacity]="line.strong ? 0.9 : 0.35"
  />
}

@if (loopX(); as x) {
  <svg:line
    y1="0"
    class="stroke-good"
    stroke-width="1.5"
    stroke-dasharray="4 3"
    [attr.x1]="x"
    [attr.x2]="x"
    [attr.y2]="height()"
  />
}
@if (endX(); as x) {
  <svg:line
    y1="0"
    class="stroke-ink-muted"
    stroke-width="1.5"
    [attr.x1]="x"
    [attr.x2]="x"
    [attr.y2]="height()"
  />
}
