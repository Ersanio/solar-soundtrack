<svg:rect x="0" y="0" class="fill-surface" [attr.width]="keyWidth" [attr.height]="height()" />
@for (key of rows(); track key.row) {
  @let lit = held().has(key.row);
  <!-- A press sounds the key on the channel being edited, through the same
       one-note engine a bar's click uses. -->
  <svg:rect
    x="0"
    rx="1"
    [attr.y]="key.y"
    [attr.width]="keyWidth - 5"
    [attr.height]="key.height"
    [class]="lit ? 'fill-accent' : key.fill"
    [class.cursor-pointer]="playable()"
    (pointerdown)="pressed.emit(key.row)"
  />
  @if (pressing() === key.row) {
    <!-- Its own element, inset: a stroke is centred on the path, so one on the
         key itself would lose its left half off the edge of the column. -->
    <svg:rect
      x="0.75"
      rx="1"
      fill="none"
      stroke-width="1.5"
      pointer-events="none"
      class="stroke-ink"
      [attr.y]="key.y + 0.75"
      [attr.width]="keyWidth - 6.5"
      [attr.height]="key.height - 1.5"
    />
  }
  @if (showLabels()) {
    <svg:text
      x="4"
      pointer-events="none"
      dominant-baseline="central"
      [class]="lit ? 'fill-surface font-mono' : key.textFill"
      [attr.y]="key.textY"
      [attr.font-size]="labelSize()"
    >
      {{ key.label }}
    </svg:text>
  }
}
<svg:line
  y1="0"
  class="stroke-edge"
  stroke-width="1"
  [attr.x1]="keyWidth"
  [attr.x2]="keyWidth"
  [attr.y2]="height()"
/>
