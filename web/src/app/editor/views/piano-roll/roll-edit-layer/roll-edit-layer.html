<svg:defs>
  <!-- The ghost's stripes. `userSpaceOnUse` so they stay the same width at every
       zoom rather than stretching with the bar they fill. -->
  <svg:pattern
    id="amk-roll-ghost"
    width="6"
    height="6"
    patternUnits="userSpaceOnUse"
    patternTransform="rotate(45)"
  >
    <svg:line y1="0" y2="6" x1="0" x2="0" class="stroke-ink-muted" stroke-width="2" />
  </svg:pattern>
</svg:defs>

@if (preview(); as shown) {
  <!-- Where a note will be pushed to: an outline and stripes, no fill and no
       glyphs, so it reads as a place rather than as a note. -->
  @for (bar of shown.ghost; track bar.id) {
    <svg:rect
      rx="2"
      fill="url(#amk-roll-ghost)"
      fill-opacity="0.35"
      class="stroke-ink-muted"
      stroke-width="1"
      stroke-dasharray="3 2"
      [attr.x]="bar.x"
      [attr.y]="bar.y"
      [attr.width]="bar.w"
      [attr.height]="bar.h"
    />
  }

  <!-- The note being dragged. Red while it cannot be committed, which is the
       one signal for both an overlap and a push with nowhere to go. -->
  @for (bar of shown.live; track bar.id) {
    <svg:rect
      rx="2"
      stroke-width="1.5"
      [class]="blocked() ? 'fill-danger stroke-danger' : `${fill()} stroke-ink`"
      [attr.fill-opacity]="blocked() ? 0.5 : 0.9"
      [attr.x]="bar.x"
      [attr.y]="bar.y"
      [attr.width]="bar.w"
      [attr.height]="bar.h"
    />
  }

  <!-- The ticks where two notes would sound at once, down the whole stack: the
       two notes are on different rows, and washing one would say the other was
       fine. -->
  @for (bar of shown.clash; track bar.id) {
    <svg:rect
      class="fill-danger"
      fill-opacity="0.2"
      pointer-events="none"
      [attr.x]="bar.x"
      [attr.y]="bar.y"
      [attr.width]="bar.w"
      [attr.height]="bar.h"
    />
  }
}

@if (bubble(); as tip) {
  <!-- Same palette as the volume slider's readout: a raised plate, an edge, and
       tabular figures so the count does not jitter as it counts. -->
  <svg:g pointer-events="none" [attr.transform]="`translate(${tip.x} ${tip.y})`">
    <svg:rect
      x="-44"
      y="-22"
      width="88"
      height="18"
      rx="3"
      class="fill-raised stroke-edge"
      stroke-width="1"
    />
    <svg:text
      x="0"
      y="-13"
      text-anchor="middle"
      dominant-baseline="central"
      font-size="10"
      class="fill-ink font-mono tabular-nums"
    >
      {{ tip.text }}
    </svg:text>
  </svg:g>
}

@if (marquee(); as box) {
  <svg:rect
    class="fill-accent stroke-accent"
    fill-opacity="0.12"
    stroke-width="1"
    stroke-dasharray="4 3"
    pointer-events="none"
    [attr.x]="box.x"
    [attr.y]="box.y"
    [attr.width]="box.w"
    [attr.height]="box.h"
  />
}
