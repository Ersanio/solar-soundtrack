<div class="flex flex-wrap items-center gap-2">
  <div class="flex flex-wrap items-center gap-1">
    <button type="button" [class]="chipClass(filter() === 'all')" (click)="filter.set('all')">
      All
    </button>
    @for (category of CATEGORIES; track category.id) {
      <button
        type="button"
        [class]="chipClass(filter() === category.id)"
        (click)="filter.set(category.id)"
      >
        {{ category.label }}
      </button>
    }
  </div>

  <span
    class="bg-accent/20 text-accent ml-auto shrink-0 rounded px-1.5 py-px font-mono text-[10px] font-semibold"
    [title]="
      assumed()
        ? 'No #amk, #am4 or #amm marker above the caret, so the palette assumes what the parser assumes. AddmusicK itself rejects a song with no marker (AMK0002).'
        : 'The dialect in force where the caret is. The palette follows it.'
    "
    >{{ dialect() }}{{ assumed() ? ' ?' : '' }}</span
  >
</div>

<!-- `mouseleave` on the row rather than each button, so crossing the gap
     between two of them does not blank the line and fill it again. -->
<div class="flex flex-wrap items-center gap-1.5" (mouseleave)="hovered.set(null)">
  @for (entry of entries(); track entry.key) {
    <button
      type="button"
      [class]="entryClass(entry)"
      [disabled]="entry.availability.state === 'blocked'"
      (click)="insert(entry)"
      (mouseenter)="hovered.set(entry)"
      (focus)="hovered.set(entry)"
    >
      <amk-command-icon [name]="entry.icon" />
      {{ entry.label }}
    </button>
  }
</div>

<p class="min-h-4 text-xs leading-4">
  @if (readout(); as readout) {
    <span class="text-ink font-semibold">{{ readout.label }}</span>
    <span [class]="readout.muted ? 'text-ink-muted' : 'text-warn'"> - {{ readout.text }}</span>
  } @else {
    <span class="text-ink-muted">Hover over a command to see what it does.</span>
  }
</p>
