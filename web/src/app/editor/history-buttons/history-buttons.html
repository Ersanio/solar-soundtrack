<!-- The editor's own history, which the keyboard reaches already; the same two
     commands for the mouse, from whichever toolbar is in front.

     Two small icon-only `amk-button`s on the primary plate, which is what the
     transport's Play wears: undo is the thing a porter reaches for most from
     either toolbar, and it is the one control there that has to be found
     without reading. -->
<div class="flex items-center gap-1">
  <button
    amk-button
    variant="primary"
    size="sm"
    icon
    [title]="`Undo (${historyKeys.undo})`"
    [disabled]="!canUndo()"
    (click)="undo()"
  >
    <amk-icon-undo />
  </button>
  <button
    amk-button
    variant="primary"
    size="sm"
    icon
    [title]="`Redo (${historyKeys.redo})`"
    [disabled]="!canRedo()"
    (click)="redo()"
  >
    <amk-icon-redo />
  </button>
</div>
