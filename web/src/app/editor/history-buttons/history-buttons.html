<!-- The editor's own history, which the keyboard reaches already; the same two
     commands for the mouse, from whichever toolbar is in front. -->
<div class="flex items-center gap-1">
  <button
    type="button"
    class="border-edge text-ink-muted hover:not-disabled:text-ink cursor-pointer rounded-md border px-1.5 py-1.5 transition-colors disabled:cursor-not-allowed disabled:opacity-40"
    [title]="`Undo (${historyKeys.undo})`"
    [disabled]="!canUndo()"
    (click)="undo()"
  >
    <amk-icon-undo />
  </button>
  <button
    type="button"
    class="border-edge text-ink-muted hover:not-disabled:text-ink cursor-pointer rounded-md border px-1.5 py-1.5 transition-colors disabled:cursor-not-allowed disabled:opacity-40"
    [title]="`Redo (${historyKeys.redo})`"
    [disabled]="!canRedo()"
    (click)="redo()"
  >
    <amk-icon-redo />
  </button>
</div>
