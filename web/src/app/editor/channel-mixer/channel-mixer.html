<h3 i18n="@@mixer.channels" class="text-ink-muted text-xs font-semibold tracking-wide uppercase">
  mixer.channels
</h3>

@for (channel of rows(); track channel.index) {
  <div [class]="channel.strip">
    <span [class]="channel.plate">{{ channel.index }}</span>

    <button
      type="button"
      title="mixer.mute.title {{
        channel.index // i18n(ph='channel')
      }}"
      [class]="channel.mute"
      [disabled]="mixer.isSoloing()"
      i18n-title="@@mixer.mute.title"
      (click)="mixer.toggleMute(channel.index)"
    >
      <ng-container i18n="@@mixer.mute">mixer.mute</ng-container>
    </button>

    <button
      type="button"
      title="mixer.solo.title {{
        channel.index // i18n(ph='channel')
      }}"
      [class]="channel.solo"
      i18n-title="@@mixer.solo.title"
      (click)="mixer.toggleSolo(channel.index)"
    >
      <ng-container i18n="@@mixer.solo">mixer.solo</ng-container>
    </button>
  </div>
}

<button
  i18n="@@mixer.reset"
  amk-button
  variant="ghost"
  size="sm"
  [disabled]="!mixer.hasChannelOverrides()"
  (click)="mixer.clearChannels()"
>
  mixer.reset
</button>
