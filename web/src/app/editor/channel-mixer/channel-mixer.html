<h3 class="text-ink-muted text-xs font-semibold tracking-wide uppercase">Channels</h3>

@for (channel of rows(); track channel.index) {
  <div [class]="channel.strip">
    <span [class]="channel.plate">{{ channel.index }}</span>

    @let toggleClass = 'cursor-pointer px-1.5 py-0.5 font-mono text-xs transition-colors';

    <button
      type="button"
      [class]="`${toggleClass} disabled:cursor-not-allowed disabled:opacity-40${channel.muted ? ' bg-danger/20 text-danger font-semibold' : ' text-ink-muted hover:not-disabled:text-ink'}`"
      [disabled]="mixer.isSoloing()"
      [title]="`Mute channel ${channel.index}`"
      (click)="mixer.toggleMute(channel.index)"
    >
      M
    </button>

    <button
      type="button"
      [class]="
        toggleClass +
        (channel.soloed
          ? ' bg-accent/20 text-accent font-semibold'
          : ' text-ink-muted hover:not-disabled:text-ink')
      "
      [title]="`Solo channel ${channel.index}`"
      (click)="mixer.toggleSolo(channel.index)"
    >
      S
    </button>
  </div>
}

<button
  amk-button
  variant="ghost"
  [disabled]="!mixer.hasChannelOverrides()"
  (click)="mixer.clearChannels()"
>
  Reset
</button>
