<h3 class="text-ink-muted text-xs font-semibold tracking-wide uppercase">Channels</h3>

@for (channel of playback.channels(); track channel.index) {
  <div class="border-edge flex items-center overflow-hidden rounded-md border">
    <span
      class="border-edge border-r px-1.5 py-0.5 font-mono text-xs"
      [class.text-ink-muted]="!channel.audible"
      [class.line-through]="!channel.audible"
    >
      {{ channel.index }}
    </span>

    @let toggleClass = 'cursor-pointer px-1.5 py-0.5 font-mono text-xs transition-colors';

    <button
      type="button"
      [class]="`${toggleClass}disabled:cursor-not-allowed disabled:opacity-40${channel.muted ? ' bg-danger/20 text-danger font-semibold' : ' text-ink-muted hover:not-disabled:text-ink'}`"
      [disabled]="playback.isSoloing()"
      [attr.aria-pressed]="channel.muted"
      [attr.aria-label]="`Mute channel ${channel.index}`"
      [title]="`Mute channel ${channel.index}`"
      (click)="playback.toggleMute(channel.index)"
    >
      M
    </button>

    <button
      type="button"
      [class]="
        toggleClass +
        (channel.soloed
          ? ' bg-accent/20 text-accent font-semibold'
          : ' text-ink-muted hover:not-disabled:text-ink')
      "
      [attr.aria-pressed]="channel.soloed"
      [attr.aria-label]="`Solo channel ${channel.index}`"
      [title]="`Solo channel ${channel.index}`"
      (click)="playback.toggleSolo(channel.index)"
    >
      S
    </button>
  </div>
}

<button
  amk-button
  variant="ghost"
  [disabled]="!playback.hasChannelOverrides()"
  (click)="playback.clearChannels()"
>
  Reset
</button>
