<h3 class="text-ink-muted text-xs font-semibold tracking-wide uppercase">Channels</h3>

@for (channel of rows(); track channel.index) {
  <div [class]="channel.strip">
    <span [class]="channel.plate">{{ channel.index }}</span>

    <button
      type="button"
      [class]="channel.mute"
      [disabled]="mixer.isSoloing()"
      [title]="`Mute channel ${channel.index}`"
      (click)="mixer.toggleMute(channel.index)"
    >
      M
    </button>

    <button
      type="button"
      [class]="channel.solo"
      [title]="`Solo channel ${channel.index}`"
      (click)="mixer.toggleSolo(channel.index)"
    >
      S
    </button>
  </div>
}

<button
  amk-button
  variant="ghost"
  [disabled]="!mixer.hasChannelOverrides()"
  (click)="mixer.clearChannels()"
>
  Reset
</button>
