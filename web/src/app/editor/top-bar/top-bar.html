<h1 class="mr-2 text-base font-semibold">Solar Soundtrack</h1>

<amk-checkbox [(checked)]="store.autoCompile">Compile as I type</amk-checkbox>

<amk-transport-controls />

<button amk-button variant="primary" [disabled]="!store.canCompile()" (click)="store.compileNow()">
  Compile
</button>

<button amk-button [disabled]="!store.canDownload()" (click)="store.downloadBin()">
  Download .bin
</button>

<button
  amk-button
  title="Compile at the driver's load address and assemble a playable SPC"
  [disabled]="!store.canDownload()"
  (click)="store.downloadSpc()"
>
  Export .spc
</button>

<div class="ml-auto flex items-center gap-3">
  <amk-changelog />

  <a
    target="_blank"
    rel="noopener noreferrer"
    class="text-ink-muted hover:text-ink flex items-center gap-1.5 text-sm hover:underline"
    [href]="commitUrl"
    [attr.aria-label]="`View commit ${commitShort} on GitHub`"
  >
    <amk-icon-github />
    {{ commitShort }}
  </a>
</div>
