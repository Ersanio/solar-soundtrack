<h1 class="text-sm font-semibold whitespace-nowrap">Solar Soundtrack</h1>

<amk-transport-controls class="min-w-0" />

<amk-aram-meter />

<button
  amk-button
  size="md"
  title="Download the compiled song data — the same bytes the SPC carries"
  [disabled]="!store.canDownload()"
  (click)="store.downloadBin()"
>
  <amk-icon-download />
  <span class="max-xl:hidden">Download .bin</span>
</button>

<button
  amk-button
  size="md"
  title="Compile at the driver's load address and assemble a playable SPC"
  [disabled]="!store.canDownload()"
  (click)="store.downloadSpc()"
>
  <amk-icon-download />
  <span class="max-xl:hidden">Export .spc</span>
</button>

<div class="ml-auto flex items-center gap-1">
  <amk-theme-picker />

  <amk-changelog />

  <a
    target="_blank"
    rel="noopener noreferrer"
    class="text-ink-muted hover:text-ink inline-flex h-8 items-center gap-1.5 rounded-md px-2"
    [href]="commitUrl"
    [title]="`Commit ${commitShort}`"
  >
    <amk-icon-github />
    <span class="font-mono text-xs max-xl:hidden">{{ commitShort }}</span>
  </a>
</div>
