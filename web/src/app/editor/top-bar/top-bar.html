<h1 i18n="@@topbar.app-name" class="text-sm font-semibold whitespace-nowrap">topbar.app-name</h1>

<amk-transport-controls class="min-w-0" />

<amk-aram-meter />

<amk-scope-mini class="max-xl:hidden" />

<!-- The exports on the right, dark as the transport is, and ruled off from
     the app's own buttons. -->
<div class="ml-auto flex items-center gap-2">
  <!-- The labels show only where the row has room for them beside the
       transport; below that each button is its glyph alone. -->

  <amk-suppressions-button />

  <!-- Lit while keyboards are being listened to, found or not; the keys reach
       the piano roll only. -->
  <button
    amk-toggle
    size="md"
    [pressed]="midi.status() === 'on'"
    [disabled]="midi.status() === 'unsupported' || midi.status() === 'asking'"
    [attr.title]="midiTitle()"
    (click)="toggleMidi()"
  >
    <amk-icon-roll />
    <span class="max-[98rem]:hidden">{{ midiLabel() }}</span>
  </button>

  <amk-menu variant="dark" [disabled]="!store.canDownload()">
    <amk-icon-download menuTrigger />
    <span i18n="@@topbar.export" menuTrigger class="max-2xl:hidden">topbar.export</span>

    <button amk-button variant="ghost" size="sm" [disabled]="wav.running()" (click)="wav.export()">
      <span i18n="@@topbar.export.wav">topbar.export.wav</span>
    </button>
    <button amk-button variant="ghost" size="sm" (click)="store.downloadSpc()">
      <span i18n="@@topbar.export-spc">topbar.export-spc</span>
    </button>
    <button amk-button variant="ghost" size="sm" (click)="store.downloadBin()">
      <span i18n="@@topbar.export.bin">topbar.export.bin</span>
    </button>
  </amk-menu>

  <!-- A label rather than a button, so the press is the file picker's own; what it
       picked opens the Import dialog whatever its format, which says why if it cannot. -->
  <label i18n-title="@@topbar.import.title" title="topbar.import.title" [class]="importClass">
    <amk-icon-upload />
    <span i18n="@@topbar.import" class="max-2xl:hidden">topbar.import</span>
    <input
      type="file"
      class="hidden"
      accept=".mid,.midi,.rmi,.kar,.mod,.umx,audio/midi,audio/mod,audio/x-mod"
      (change)="onImportFile($event)"
    />
  </label>

  <amk-import-dialog #importer />
  <amk-mod-import-dialog />

  <span class="bg-edge h-5 w-px shrink-0"></span>

  <div class="flex items-center gap-1">
    <!-- Relative to the base href, so it finds the guide that CI deploys beside the app. -->
    <a
      i18n="@@topbar.docs"
      hidden
      href="docs/"
      target="_blank"
      rel="noopener"
      class="text-ink-muted hover:text-ink inline-flex h-8 items-center rounded-md px-2 text-sm"
      title="topbar.docs.title"
      i18n-title="@@topbar.docs.title"
    >
      topbar.docs
    </a>

    <amk-theme-picker />

    <amk-changelog />

    <a
      target="_blank"
      rel="noopener noreferrer"
      class="text-ink-muted hover:text-ink inline-flex h-8 items-center gap-1.5 rounded-md px-2"
      title="topbar.commit.title {{
        commitShort // i18n(ph='commit')
      }}"
      [href]="commitUrl"
      i18n-title="@@topbar.commit.title"
    >
      <amk-icon-github />
      <span class="font-mono text-xs max-xl:hidden">{{ commitShort }}</span>
    </a>
  </div>
</div>
