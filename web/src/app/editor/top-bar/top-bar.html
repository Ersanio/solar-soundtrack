<h1 i18n="@@topbar.app-name" class="text-sm font-semibold whitespace-nowrap">topbar.app-name</h1>

<amk-transport-controls class="min-w-0" />

<amk-aram-meter />

<!-- The two labels show only where the row has room for them beside the
     transport; below that the glyph and the title carry each button. -->
<button
  amk-button
  size="md"
  i18n-title="@@topbar.download-the-compiled-song.title"
  title="topbar.download-the-compiled-song.title"
  [disabled]="!store.canDownload()"
  (click)="store.downloadBin()"
>
  <amk-icon-download />
  <span i18n="@@topbar.download-bin" class="max-2xl:hidden">topbar.download-bin</span>
</button>

<button
  amk-button
  size="md"
  i18n-title="@@topbar.compile-at-the-drivers.title"
  title="topbar.compile-at-the-drivers.title"
  [disabled]="!store.canDownload()"
  (click)="store.downloadSpc()"
>
  <amk-icon-download />
  <span i18n="@@topbar.export-spc" class="max-2xl:hidden">topbar.export-spc</span>
</button>

<div class="ml-auto flex items-center gap-1">
  <!-- Relative to the base href, so it finds the guide that CI deploys beside the app. -->
  <a
    i18n="@@topbar.docs"
    hidden
    href="docs/"
    target="_blank"
    rel="noopener"
    class="text-ink-muted hover:text-ink inline-flex h-8 items-center rounded-md px-2 text-sm"
    title="topbar.docs.title"
    i18n-title="@@topbar.docs.title"
  >
    topbar.docs
  </a>

  <amk-theme-picker />

  <amk-changelog />

  <a
    target="_blank"
    rel="noopener noreferrer"
    class="text-ink-muted hover:text-ink inline-flex h-8 items-center gap-1.5 rounded-md px-2"
    title="topbar.commit.title {{
      commitShort // i18n(ph='commit')
    }}"
    [href]="commitUrl"
    i18n-title="@@topbar.commit.title"
  >
    <amk-icon-github />
    <span class="font-mono text-xs max-xl:hidden">{{ commitShort }}</span>
  </a>
</div>
