<button
  amk-button
  variant="primary"
  size="lg"
  icon
  [title]="playback.isPlaying() ? 'Pause' : 'Play'"
  [disabled]="!store.canCompile()"
  (click)="playback.toggle()"
>
  @if (playback.isPlaying()) {
    <amk-icon-pause />
  } @else {
    <amk-icon-play />
  }
</button>

<button
  amk-button
  size="md"
  icon
  title="Stop the song, or a note being previewed"
  [disabled]="!canStop()"
  (click)="stop()"
>
  <amk-icon-stop />
</button>

<button
  amk-toggle
  size="md"
  title="Keep playing past the end, round the song's loop"
  [pressed]="playback.loop()"
  (click)="playback.loop.set(!playback.loop())"
>
  <amk-icon-loop />
  Loop
</button>

<button
  amk-toggle
  size="md"
  title="While playing, reload the song at the same position whenever it recompiles"
  [pressed]="playback.hotReload()"
  (click)="playback.hotReload.set(!playback.hotReload())"
>
  Hot Reload
</button>

<!-- One well with two faces: the m:ss the clock gives a tick, or the tick itself. -->
<button
  type="button"
  class="bg-inset text-ink hover:bg-inset/70 flex h-7 cursor-pointer items-center rounded-md px-2 font-mono text-sm tabular-nums whitespace-nowrap"
  [title]="clockTitle()"
  (click)="toggleClockFace()"
>
  {{ clockLabel() }}
</button>

<input
  type="range"
  min="0"
  step="1"
  class="accent-control max-w-80 min-w-24 flex-1 cursor-pointer disabled:cursor-not-allowed disabled:opacity-40"
  title="Seek — the song replays silently to reach the new position"
  [max]="playback.durationTicks()"
  [value]="playback.position()"
  [disabled]="!playback.canSeek()"
  (input)="onScrub($event)"
  (change)="playback.commitScrub()"
  (pointerup)="playback.commitScrub()"
  (pointercancel)="playback.commitScrub()"
/>

<amk-icon-volume class="text-ink-muted" />

<span class="relative flex">
  <input
    type="range"
    min="0"
    class="accent-control w-20 cursor-pointer"
    title="Volume"
    [max]="VOLUME_MAX"
    [value]="mixer.volume()"
    (input)="onVolume($event)"
    (pointerdown)="volumeReadout.set(true)"
    (pointerup)="volumeReadout.set(false)"
    (pointercancel)="volumeReadout.set(false)"
    (blur)="volumeReadout.set(false)"
  />
  @if (volumeBubble(); as bubble) {
    <span
      class="border-edge bg-raised text-ink pointer-events-none absolute top-full z-10 mt-1 -translate-x-1/2 rounded border px-1.5 py-0.5 font-mono text-xs tabular-nums whitespace-nowrap shadow-lg"
      [style.left]="bubble.left"
    >
      {{ bubble.text }}
    </span>
  }
</span>
