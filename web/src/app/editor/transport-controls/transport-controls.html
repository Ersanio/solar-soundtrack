<!-- One dark, round-ended housing, as FL Studio's transport has; the pause glyph
     lights in the accent while the song runs, the accent being where the music is. -->
<amk-button-group pill>
  <button
    amk-button
    variant="dark"
    size="md"
    icon
    [title]="playback.isPlaying() ? text.pause : text.play"
    [disabled]="!store.canCompile()"
    (click)="playback.toggle()"
  >
    @if (playback.isPlaying()) {
      <amk-icon-pause class="text-accent" />
    } @else {
      <amk-icon-play />
    }
  </button>

  <button amk-button variant="dark" size="md" icon [disabled]="!canStop()" (click)="stop()">
    <amk-icon-stop />
  </button>
</amk-button-group>

<button
  amk-toggle
  size="md"
  [pressed]="playback.loop()"
  (click)="playback.loop.set(!playback.loop())"
>
  <amk-icon-loop />
  <span i18n="@@transport.loop" class="max-xl:hidden">transport.loop</span>
</button>

<button
  i18n="@@transport.hot-reload"
  amk-toggle
  size="md"
  i18n-title="@@transport.hot-reload.title"
  title="transport.hot-reload.title"
  [pressed]="playback.hotReload()"
  (click)="playback.hotReload.set(!playback.hotReload())"
>
  transport.hot-reload
</button>

<!-- One well with two faces: the m:ss the clock gives a tick, or the tick itself. -->
<button
  type="button"
  class="well text-ink hover:bg-surface flex h-7 cursor-pointer items-center rounded-sm px-2 font-mono text-sm tabular-nums whitespace-nowrap"
  [title]="clockTitle()"
  (click)="toggleClockFace()"
>
  {{ clockLabel() }}
</button>

<input
  type="range"
  min="0"
  step="1"
  class="accent-control max-w-80 min-w-16 flex-1 cursor-pointer xl:min-w-24 disabled:cursor-not-allowed disabled:opacity-40"
  i18n-title="@@transport.seek-the-song-replays.title"
  title="transport.seek-the-song-replays.title"
  [max]="playback.durationTicks()"
  [value]="playback.position()"
  [disabled]="!playback.canSeek()"
  (input)="onScrub($event)"
  (change)="playback.commitScrub()"
  (pointerup)="playback.commitScrub()"
  (pointercancel)="playback.commitScrub()"
/>

<amk-icon-volume class="text-ink-muted" />

<span class="relative flex">
  <input
    type="range"
    min="0"
    class="accent-control w-16 cursor-pointer xl:w-20"
    i18n-title="@@transport.volume.title"
    title="transport.volume.title"
    [max]="VOLUME_MAX"
    [value]="mixer.volume()"
    (input)="onVolume($event)"
    (pointerdown)="volumeReadout.set(true)"
    (pointerup)="volumeReadout.set(false)"
    (pointercancel)="volumeReadout.set(false)"
    (blur)="volumeReadout.set(false)"
  />
  @if (volumeBubble(); as bubble) {
    <span
      class="border-edge bg-raised text-ink pointer-events-none absolute top-full z-10 mt-1 -translate-x-1/2 rounded border px-1.5 py-0.5 font-mono text-xs tabular-nums whitespace-nowrap shadow-lg"
      [style.left]="bubble.left"
    >
      {{ bubble.text }}
    </span>
  }
</span>
