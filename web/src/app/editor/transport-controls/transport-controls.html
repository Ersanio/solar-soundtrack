<button amk-button variant="primary" [disabled]="!store.canCompile()" (click)="playback.toggle()">
  {{ playback.isPlaying() ? '❚❚ Pause' : '▶ Play' }}
</button>

<button amk-button title="Stop" [disabled]="playback.isIdle()" (click)="playback.stop()">■</button>

<input
  type="range"
  min="0"
  step="1"
  class="accent-accent w-24 cursor-pointer disabled:cursor-not-allowed disabled:opacity-40"
  title="Seek — the song replays silently to reach the new position"
  [max]="playback.durationTicks()"
  [value]="playback.position()"
  [disabled]="!playback.canSeek()"
  (input)="onScrub($event)"
  (change)="playback.commitScrub()"
  (pointerup)="playback.commitScrub()"
  (pointercancel)="playback.commitScrub()"
/>

<span class="text-ink-muted w-20 font-mono text-xs tabular-nums">
  {{ playback.timeLabel() }} / {{ playback.durationLabel() }}
</span>

<amk-checkbox
  title="While playing, reload the song at the same position whenever it recompiles"
  [(checked)]="playback.live"
>
  Live
</amk-checkbox>

<amk-checkbox title="Keep playing past the end, round the song's loop" [(checked)]="playback.loop">
  Loop
</amk-checkbox>

<input
  type="range"
  min="0"
  max="500"
  class="accent-accent w-20 cursor-pointer"
  title="Volume"
  [value]="playback.volume()"
  (input)="onVolume($event)"
/>
