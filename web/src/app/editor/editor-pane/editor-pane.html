<amk-panel heading="Editor" class="min-h-0 flex-1">
  <button
    panelHeadingAside
    type="button"
    [class]="wrapButtonClass()"
    [title]="wordWrap() ? 'Word wrap: on' : 'Word wrap: off'"
    (click)="toggleWordWrap()"
  >
    <amk-icon-wrap />
  </button>

  <!-- Will grow into a toolbar; the tabs and the caret readout are all it holds for now. -->
  <div panelAside class="flex items-center gap-3">
    <amk-tabs [tabs]="TABS" [(active)]="tab" />
    @if (tab() === 'source') {
      <span class="text-ink-muted font-mono text-xs">{{ store.caretLabel() }}</span>
    }
  </div>

  <!-- Hidden rather than destroyed on tab switch, so the CodeMirror view keeps
       its undo history, scroll position and selection. -->
  <div class="h-full" [class.hidden]="tab() !== 'source'">
    <div #editorHost class="h-full"></div>
  </div>
  @if (tab() === 'samples') {
    <div class="flex h-full min-h-0 flex-col">
      <amk-sample-browser class="min-h-0 flex-1" />
    </div>
  }
</amk-panel>

<amk-channel-mixer />
