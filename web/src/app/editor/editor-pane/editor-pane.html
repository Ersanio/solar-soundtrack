<amk-panel class="min-h-0 flex-1">
  <amk-tabs panelHeading [tabs]="VIEWS" [(active)]="view" />

  <div class="flex h-full min-h-0 flex-col">
    <!--
      Hidden rather than destroyed, so the CodeMirror view keeps its undo
      history, scroll position and selection. Every other view is built on
      selection and thrown away again, having nothing that could not be rebuilt.
    -->
    <div class="flex min-h-0 flex-1 flex-col" [class.hidden]="view() !== 'source'">
      <amk-source-view
        class="min-h-0 flex-1"
        [active]="view() === 'source'"
        (activate)="view.set('source')"
      />
    </div>

    @switch (view()) {
      @case ('samples') {
        <amk-sample-browser class="min-h-0 flex-1" />
      }
      @case ('roll') {
        <amk-piano-roll class="min-h-0 flex-1" />
      }
      @default {
        <!-- Source, which is rendered above and hidden rather than built. -->
      }
    }
  </div>
</amk-panel>

<amk-channel-mixer />
