<amk-popover heading="Changelog" title="Changelog">
  <amk-icon-book popoverIcon />

  @for (entry of entries; track entry.date) {
    <h3 class="text-ink-muted mt-3 text-xs font-semibold tracking-wide uppercase first:mt-0">
      {{ entry.date }}
    </h3>
    <ul class="mt-1 list-disc space-y-1 pl-4 text-sm">
      @for (item of entry.items; track item) {
        <li>{{ item }}</li>
      }
    </ul>
  }
</amk-popover>
