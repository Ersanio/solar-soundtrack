<div class="border-edge flex items-center justify-between gap-3 border-y px-3 py-1.5">
  <h3 class="text-ink-muted text-xs font-semibold tracking-wide uppercase">Hex dump</h3>
  <span class="text-ink-muted font-mono text-xs">{{ range() }}</span>
</div>

<pre
  class="text-ink overflow-x-auto p-3 font-mono text-xs leading-snug"
>@for (row of rows(); track row.address) {<span
    class="text-ink-muted"
  >{{ row.address }}  </span><span class="text-accent">{{ row.header }}</span>{{ row.rest }}
}@if (truncated(); as more) {<span class="text-ink-muted">… {{ more }} more bytes</span>
}</pre>
