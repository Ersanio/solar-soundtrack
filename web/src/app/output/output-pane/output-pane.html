<!-- The drawer's own header, below `lg` only: it stands in for the Inspector
     section's header there, which `command-inspector.html` hides at the same
     breakpoint, so the drawer folds to one row that names what is inside it. -->
<button
  type="button"
  class="border-edge bg-raised flex h-9 shrink-0 cursor-pointer items-center justify-between gap-3 border-b px-3 lg:hidden"
  (click)="collapseToggle.emit()"
>
  <span
    i18n="@@output.inspector"
    class="text-ink-muted text-xs font-semibold tracking-wide uppercase"
    >Inspector</span
  >
  <span class="text-ink-muted flex items-center gap-2 text-xs">
    @if (collapsed()) {
      <ng-container i18n="@@output.show">Show</ng-container>
      <amk-icon-chevron-right />
    } @else {
      <ng-container i18n="@@output.hide">Hide</ng-container>
      <amk-icon-chevron-down />
    }
  </span>
</button>

<div [class]="bodyClass()">
  @if (blocked()) {
    <p i18n="@@output.cannot-compile-without-a" class="text-danger m-3 text-xs leading-relaxed">
      Cannot compile without a driver —
      {{
        driverProblem() // i18n(ph='problem')
      }}
      The song's load address comes from the driver's song pointer table, so there is nothing to
      compile against.
    </p>
  } @else {
    <div class="min-h-0 flex-1 overflow-auto">
      <amk-command-inspector />

      <amk-section
        #build
        i18n-heading="@@output.build.heading"
        heading="Build"
        collapsible
        [(open)]="buildOpen"
      >
        <span sectionAside class="font-mono text-xs" [class.text-danger]="overflowing()">{{
          store.freeLabel()
        }}</span>
        <amk-stats-grid />
        <amk-aram-budget />
        <amk-hex-dump />
      </amk-section>
    </div>

    <!-- Pinned under the scroll column, so it stays in view whatever the inspector's height. -->
    <amk-section
      i18n-heading="@@output.problems.heading"
      heading="Problems"
      collapsible
      class="max-h-[30%] shrink-0"
      [(open)]="problemsOpen"
    >
      <span sectionAside [class]="problemsBadgeClass()">{{ problemsCount() }}</span>
      <div class="min-h-0 flex-1 overflow-auto">
        <amk-diagnostics-list />
      </div>
    </amk-section>
  }
</div>
