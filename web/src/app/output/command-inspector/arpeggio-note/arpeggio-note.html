@let row = note();
@if (row.isMarker) {
  <!-- A marker occupies the slot rather than sitting between two, so it
       replaces the row rather than decorating it. -->
  <span class="flex-1 py-1 text-xs" [class.text-accent]="row.isLive">
    <span class="font-mono">$80</span>
    —
    @if (row.isLive) {
      <ng-container i18n="@@inspector.arpeggio-note.restarts-here"
        >inspector.arpeggio-note.restarts-here</ng-container
      >
    } @else {
      <ng-container i18n="@@inspector.arpeggio-note.overridden"
        >inspector.arpeggio-note.overridden</ng-container
      >
    }
  </span>
} @else {
  <amk-slider
    class="flex-1"
    origin="centre"
    label="inspector.arpeggio-note.note.label {{
      row.index + 1 // i18n(ph='number')
    }}"
    i18n-label="@@inspector.arpeggio-note.note.label"
    [signed]="true"
    [value]="row.value"
    [min]="-127"
    [max]="127"
    [valueLabel]="row.hex"
    [note]="row.meaning"
    [disabled]="!editable()"
    (preview)="previewed.emit({ index: row.index, value: $event })"
    (commit)="committed.emit({ index: row.index, value: $event })"
  />
}
<button
  amk-button
  variant="ghost"
  [title]="row.isMarker ? text.clearLoop : text.restartHere"
  [disabled]="!row.canMark && !row.isMarker"
  (click)="looped.emit(row.index)"
>
  @if (row.isMarker) {
    <ng-container i18n="@@inspector.arpeggio-note.unloop"
      >inspector.arpeggio-note.unloop</ng-container
    >
  } @else {
    <ng-container i18n="@@inspector.arpeggio-note.loop">inspector.arpeggio-note.loop</ng-container>
  }
</button>
<button
  i18n="@@inspector.arpeggio-note.remove"
  amk-button
  variant="ghost"
  i18n-title="@@inspector.arpeggio-note.remove-this-entry.title"
  title="inspector.arpeggio-note.remove-this-entry.title"
  [disabled]="!resizable()"
  (click)="removed.emit(row.index)"
>
  inspector.arpeggio-note.remove
</button>
