<figure class="m-0">
  <svg
    preserveAspectRatio="none"
    class="bg-inset border-edge h-24 w-full rounded-sm border"
    [attr.viewBox]="plot.box"
  >
    <!-- The unwobbled pitch, so the wave reads as a departure from it. -->
    <line
      x1="0"
      class="stroke-edge"
      stroke-width="0.5"
      stroke-dasharray="3 3"
      [attr.x2]="plot.w"
      [attr.y1]="centreY"
      [attr.y2]="centreY"
    />

    <!-- The delay, shaded, so it is visibly part of the setting and not dead space. -->
    @if (delayX() > 0) {
      <rect x="0" y="0" class="fill-ink-muted/15" [attr.width]="delayX()" [attr.height]="plot.h" />
      <line
        y1="0"
        class="stroke-edge"
        stroke-width="0.5"
        [attr.x1]="delayX()"
        [attr.x2]="delayX()"
        [attr.y2]="plot.h"
      />
    }

    <path fill="none" class="stroke-accent" stroke-width="0.5" [attr.d]="path()" />
  </svg>

  <figcaption class="text-ink-muted mt-1 flex justify-between gap-2 font-mono text-[10px]">
    <span>{{ cycleLabel() }}</span>
    <span>{{ spanLabel }}</span>
  </figcaption>
</figure>
