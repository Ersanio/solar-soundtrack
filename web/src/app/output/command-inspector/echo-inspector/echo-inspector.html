@if (isEchoOff()) {
  <p class="text-ink-muted text-xs leading-relaxed">
    Silences the echo and clears every channel's echo bit. The buffer stays reserved — only
    <code class="text-ink">$FA $04</code> changes that, and the compiler writes it for you.
  </p>
} @else if (isF1()) {
  <amk-echo-config [command]="command()" />
} @else {
  @if (isEf()) {
    <amk-bit-toggles
      legend="Channels"
      [value]="bytes.at(0)"
      [labels]="VOICE_LABELS"
      [valueLabel]="maskLabel()"
      [disabled]="!bytes.editable(0)"
      [note]="bytes.lockedBecause(0)"
      (changed)="bytes.commit(0, $event)"
    />
  }

  @if (isFade()) {
    <amk-slider
      label="Over"
      [value]="bytes.at(0)"
      [max]="255"
      [note]="bytes.lockedBecause(0) ?? fadeLabel()"
      [disabled]="!bytes.editable(0)"
      (preview)="bytes.preview(0, $event)"
      (commit)="bytes.commit(0, $event)"
    />
  }

  <!-- The pair `$EF` sets outright and `$F2` fades to. Same two bytes, same
       reading, so only the labels tell them apart. -->
  <amk-slider
    origin="centre"
    [label]="isFade() ? 'To volume L' : 'Volume L'"
    [signed]="true"
    [value]="bytes.signedAt(1)"
    [min]="-128"
    [max]="127"
    [note]="bytes.lockedBecause(1) ?? bytes.signedNote(1)"
    [disabled]="!bytes.editable(1)"
    (preview)="bytes.preview(1, $event)"
    (commit)="bytes.commit(1, $event)"
  />
  <amk-slider
    origin="centre"
    [label]="isFade() ? 'To volume R' : 'Volume R'"
    [signed]="true"
    [value]="bytes.signedAt(2)"
    [min]="-128"
    [max]="127"
    [note]="bytes.lockedBecause(2) ?? bytes.signedNote(2)"
    [disabled]="!bytes.editable(2)"
    (preview)="bytes.preview(2, $event)"
    (commit)="bytes.commit(2, $event)"
  />
}
