@if (isEchoOff()) {
  <p class="text-ink-muted text-xs leading-relaxed">
    Silences the echo and clears every channel's echo bit. The buffer stays reserved — only
    <code class="text-ink">$FA $04</code> changes that, and the compiler writes it for you.
  </p>
} @else if (isF1()) {
  <amk-echo-config [command]="command()" />
} @else {
  @if (isEf()) {
    <amk-bit-toggles
      legend="Channels"
      [value]="mask()"
      [labels]="VOICE_LABELS"
      [valueLabel]="maskLabel()"
      [disabled]="!editable(0)"
      [note]="lockedBecause(0)"
      (changed)="setArg(0, $event)"
    />
  }

  @if (isFade()) {
    <amk-slider
      label="Over"
      [value]="fadeTicks()"
      [max]="255"
      [note]="lockedBecause(0) ?? fadeLabel()"
      [disabled]="!editable(0)"
      (preview)="preview(0, $event)"
      (commit)="setArg(0, $event)"
    />
  }

  <!-- The pair `$EF` sets outright and `$F2` fades to. Same two bytes, same
       reading, so only the labels tell them apart. -->
  <amk-slider
    origin="centre"
    [label]="isFade() ? 'To volume L' : 'Volume L'"
    [signed]="true"
    [value]="signedOf(1)"
    [min]="-128"
    [max]="127"
    [note]="lockedBecause(1) ?? signedNote(1)"
    [disabled]="!editable(1)"
    (preview)="preview(1, $event)"
    (commit)="setArg(1, $event)"
  />
  <amk-slider
    origin="centre"
    [label]="isFade() ? 'To volume R' : 'Volume R'"
    [signed]="true"
    [value]="signedOf(2)"
    [min]="-128"
    [max]="127"
    [note]="lockedBecause(2) ?? signedNote(2)"
    [disabled]="!editable(2)"
    (preview)="preview(2, $event)"
    (commit)="setArg(2, $event)"
  />
}
