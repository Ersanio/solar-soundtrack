@if (!written()) {
  <p i18n="@@inspector.pan.needs-a-pan-value" class="text-ink-muted text-xs leading-relaxed">
    inspector.pan.needs-a-pan-value <code class="text-ink"></code> <code class="text-ink"></code>
  </p>
} @else {
  <p class="text-ink-muted text-xs leading-relaxed">{{ note() }}</p>

  <amk-slider
    i18n-label="@@inspector.pan.pan.label"
    label="inspector.pan.pan.label"
    origin="centre"
    [value]="pan()"
    [max]="20"
    [invert]="true"
    [ends]="['L', 'R']"
    [valueLabel]="panLabel()"
    [note]="panLocked() ?? panNote()"
    [disabled]="!panEditable()"
    (preview)="preview($event)"
    (commit)="setPan($event)"
  />

  <amk-enum-select
    i18n-label="@@inspector.pan.surround-left.label"
    label="inspector.pan.surround-left.label"
    [value]="left()"
    [options]="SURROUND"
    [disabled]="!flagsEditable()"
    (commit)="setLeft($event)"
  />

  <amk-enum-select
    i18n-label="@@inspector.pan.surround-right.label"
    label="inspector.pan.surround-right.label"
    [value]="right()"
    [options]="SURROUND"
    [note]="flagsLocked()"
    [disabled]="!flagsEditable()"
    (commit)="setRight($event)"
  />

  @if (overflowed(); as problem) {
    <p class="text-warn text-xs leading-relaxed">{{ problem }}</p>
  }

  @if (unusedBit(); as unused) {
    <p class="text-ink-muted text-xs leading-relaxed">{{ unused }}</p>
  }
}
