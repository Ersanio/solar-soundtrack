@if (args().length < 2) {
  <p class="text-ink-muted text-xs leading-relaxed">
    Needs a rate and a depth, and optionally a delay before them.
  </p>
} @else {
  <amk-vibrato-graph
    [delay]="delay()"
    [rate]="rate()"
    [depth]="depth()"
    [tempo]="tempo()"
    [axis]="axis()"
  />

  @if (formNote(); as note) {
    <p class="text-ink-muted text-xs leading-relaxed">{{ note }}</p>
  }

  @if (delayIndex() >= 0) {
    <amk-slider
      label="Delay"
      [value]="delay()"
      [max]="255"
      [valueLabel]="delayLabel()"
      [note]="lockedBecause(delayIndex())"
      [disabled]="!editable(delayIndex())"
      (commit)="setArg(delayIndex(), $event)"
    />
  }

  <amk-slider
    label="Rate"
    [value]="rate()"
    [max]="255"
    [note]="lockedBecause(rateIndex()) ?? rateNote()"
    [disabled]="!editable(rateIndex())"
    (commit)="setArg(rateIndex(), $event)"
  />

  <amk-slider
    label="Depth"
    [value]="depth()"
    [max]="255"
    [note]="lockedBecause(depthIndex())"
    [disabled]="!editable(depthIndex())"
    (commit)="setArg(depthIndex(), $event)"
  />
}
