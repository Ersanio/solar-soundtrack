@if (args().length < 2) {
  <p i18n="@@inspector.vibrato.needs-a-rate-and" class="text-ink-muted text-xs leading-relaxed">
    inspector.vibrato.needs-a-rate-and
  </p>
} @else {
  <!-- The dragged values, so the shape follows the pointer. -->
  <amk-vibrato-graph
    [delay]="shownDelay()"
    [rate]="shownRate()"
    [depth]="shownDepth()"
    [tempo]="tempo()"
    [axis]="axis()"
  />

  @if (formNote(); as note) {
    <p class="text-ink-muted text-xs leading-relaxed">{{ note }}</p>
  }

  @if (delayIndex() >= 0) {
    <amk-slider
      i18n-label="@@inspector.vibrato.delay.label"
      label="inspector.vibrato.delay.label"
      [value]="delay()"
      [max]="255"
      [valueLabel]="delayLabel()"
      [note]="lockedBecause(delayIndex())"
      [disabled]="!editable(delayIndex())"
      (preview)="preview(delayIndex(), $event)"
      (commit)="setArg(delayIndex(), $event)"
    />
  }

  <amk-slider
    i18n-label="@@inspector.vibrato.rate.label"
    label="inspector.vibrato.rate.label"
    [value]="rate()"
    [max]="255"
    [note]="lockedBecause(rateIndex()) ?? rateNote()"
    [disabled]="!editable(rateIndex())"
    (preview)="preview(rateIndex(), $event)"
    (commit)="setArg(rateIndex(), $event)"
  />

  <amk-slider
    i18n-label="@@inspector.vibrato.depth.label"
    label="inspector.vibrato.depth.label"
    [value]="depth()"
    [max]="255"
    [note]="lockedBecause(depthIndex())"
    [disabled]="!editable(depthIndex())"
    (preview)="preview(depthIndex(), $event)"
    (commit)="setArg(depthIndex(), $event)"
  />
}
