<!-- Which of the two the DSP obeys. A pair of buttons rather than a select:
     it is one binary choice and it changes everything below it. -->
<div class="border-edge flex gap-1 border-b pb-2">
  <!-- The variant carries which one is on, rather than a colour laid over the
       ghost's own: `Button` binds the whole `class` attribute, so a utility
       added beside it wins or loses on the order Tailwind happened to emit the
       two in, and `text-ink-muted` sorts after every colour it would be
       overriding. The selected one is the primary button, which is the plate
       Play wears. -->
  <button
    i18n="@@inspector.envelope-tuner.adsr"
    amk-button
    [variant]="usingAdsr() ? 'primary' : 'ghost'"
    [disabled]="disabled()"
    (click)="setMode(true)"
  >
    inspector.envelope-tuner.adsr
  </button>
  <button
    i18n="@@inspector.envelope-tuner.gain"
    amk-button
    [variant]="usingAdsr() ? 'ghost' : 'primary'"
    [disabled]="disabled()"
    (click)="setMode(false)"
  >
    inspector.envelope-tuner.gain
  </button>
</div>

<amk-adsr-graph [adsr1]="graphAdsr1()" [adsr2]="graphAdsr2()" [gain]="graphGain()" />

@if (lockedBecause(); as reason) {
  <p class="text-ink-muted text-xs leading-relaxed">{{ reason }}</p>
}

<fieldset class="contents" [disabled]="disabled()">
  @if (usingAdsr()) {
    <!-- Somewhere to start. Six shapes rather than four sliders at zero. -->
    <div class="flex flex-wrap gap-1.5">
      @for (preset of PRESETS; track preset.name) {
        <button
          amk-button
          [variant]="activePreset()?.name === preset.name ? 'primary' : 'default'"
          [title]="preset.note"
          [disabled]="disabled()"
          (click)="applyPreset(preset)"
        >
          {{ preset.name }}
        </button>
      }
    </div>

    <amk-slider
      i18n-label="@@inspector.envelope-tuner.attack.label"
      label="inspector.envelope-tuner.attack.label"
      [value]="envelope().attack"
      [max]="15"
      [valueLabel]="attackLabel()"
      [disabled]="disabled()"
      (preview)="preview('attack', $event)"
      (commit)="setField('attack', $event)"
    />
    <amk-slider
      i18n-label="@@inspector.envelope-tuner.decay.label"
      label="inspector.envelope-tuner.decay.label"
      [value]="envelope().decay"
      [max]="7"
      [valueLabel]="decayLabel()"
      [disabled]="disabled()"
      (preview)="preview('decay', $event)"
      (commit)="setField('decay', $event)"
    />
    <amk-slider
      i18n-label="@@inspector.envelope-tuner.sustain.label"
      label="inspector.envelope-tuner.sustain.label"
      i18n-note="@@inspector.envelope-tuner.the-level-decay-falls.note"
      note="inspector.envelope-tuner.the-level-decay-falls.note"
      [value]="envelope().sustain"
      [max]="7"
      [valueLabel]="sustainLabel()"
      [disabled]="disabled()"
      (preview)="preview('sustain', $event)"
      (commit)="setField('sustain', $event)"
    />
    <amk-slider
      i18n-label="@@inspector.envelope-tuner.release.label"
      label="inspector.envelope-tuner.release.label"
      [value]="envelope().release"
      [max]="31"
      [valueLabel]="releaseLabel()"
      [note]="releaseNote()"
      [disabled]="disabled()"
      (preview)="preview('release', $event)"
      (commit)="setField('release', $event)"
    />
  } @else {
    <amk-enum-select
      i18n-label="@@inspector.envelope-tuner.gain-mode.label"
      label="inspector.envelope-tuner.gain-mode.label"
      [value]="gainModeIndex()"
      [options]="GAIN_MODES"
      [disabled]="disabled()"
      [note]="gainByteLabel()"
      (commit)="setGainMode($event)"
    />

    @if (gainIsDirect()) {
      <amk-slider
        i18n-label="@@inspector.envelope-tuner.level.label"
        label="inspector.envelope-tuner.level.label"
        i18n-note="@@inspector.envelope-tuner.a-fixed-level-with.note"
        note="inspector.envelope-tuner.a-fixed-level-with.note"
        [value]="gainLevel()"
        [max]="127"
        [valueLabel]="gainLevelLabel()"
        [disabled]="disabled()"
        (preview)="preview('level', $event)"
        (commit)="setGainLevel($event)"
      />
    } @else {
      <amk-slider
        i18n-label="@@inspector.envelope-tuner.rate.label"
        label="inspector.envelope-tuner.rate.label"
        [value]="gain().rate ?? 0"
        [max]="31"
        [valueLabel]="gainRateLabel()"
        [disabled]="disabled()"
        (preview)="preview('rate', $event)"
        (commit)="setGainRate($event)"
      />
    }
  }
</fieldset>
