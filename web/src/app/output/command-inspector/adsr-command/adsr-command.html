@if (args().length < 2) {
  <p
    i18n="@@inspector.adsr.to-complete-this-command-select"
    class="text-ink-muted pb-2 text-xs leading-relaxed"
  >
    inspector.adsr.to-complete-this-command-select <strong class="text-ink font-semibold"></strong>
    <strong class="text-ink font-semibold"></strong>
  </p>
}

<amk-envelope-tuner
  [value]="value()"
  [disabled]="!editable() && args().length >= 2"
  [incomplete]="args().length < 2"
  [lockedBecause]="lockedBecause()"
  (commit)="apply($event)"
/>

<p
  i18n="@@inspector.adsr.overrides-the-current-instruments"
  class="text-ink-muted pt-2 text-xs leading-relaxed"
>
  inspector.adsr.overrides-the-current-instruments <code class="text-ink"></code>
</p>
