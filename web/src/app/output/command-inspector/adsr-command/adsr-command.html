@if (args().length < 2) {
  <p class="text-ink-muted pb-2 text-xs leading-relaxed">
    Needs two arguments: either <code class="text-ink">$80</code> and a GAIN value, or an ADSR pair.
    Setting one below writes both.
  </p>
}

<amk-envelope-tuner
  [value]="value()"
  [disabled]="!editable() && args().length >= 2"
  [lockedBecause]="lockedBecause()"
  (commit)="apply($event)"
/>

<p class="text-ink-muted pt-2 text-xs leading-relaxed">
  This overrides the current instrument's own envelope until the next
  <code class="text-ink">&#64;</code> resets it.
</p>
