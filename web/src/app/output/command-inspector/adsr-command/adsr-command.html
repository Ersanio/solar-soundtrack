@if (args().length < 2) {
  <p
    i18n="@@inspector.adsr.needs-two-arguments-either"
    class="text-ink-muted pb-2 text-xs leading-relaxed"
  >
    inspector.adsr.needs-two-arguments-either <code class="text-ink"></code>
  </p>
}

<amk-envelope-tuner
  [value]="value()"
  [disabled]="!editable() && args().length >= 2"
  [lockedBecause]="lockedBecause()"
  (commit)="apply($event)"
/>

<p
  i18n="@@inspector.adsr.this-overrides-the-current"
  class="text-ink-muted pt-2 text-xs leading-relaxed"
>
  inspector.adsr.this-overrides-the-current <code class="text-ink"></code>
</p>
