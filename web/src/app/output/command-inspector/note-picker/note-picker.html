<div class="grid grid-cols-2 gap-2">
  <amk-enum-select
    label="Octave"
    [value]="octave()"
    [options]="OCTAVES"
    [disabled]="disabled()"
    (commit)="setOctave($event)"
  />
  <amk-enum-select
    [label]="label()"
    [value]="pitch()"
    [options]="pitches()"
    [disabled]="disabled()"
    (commit)="setPitch($event)"
  />
</div>
