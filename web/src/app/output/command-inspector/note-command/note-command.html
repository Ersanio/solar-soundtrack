@if (unavailable(); as why) {
  <p class="text-ink-muted text-xs leading-relaxed">{{ why }}</p>
} @else {
  <div class="flex flex-col gap-2">
    @for (group of groups(); track group.key) {
      <div class="flex flex-col gap-1">
        <div class="flex items-baseline justify-between gap-3">
          <span class="text-ink-muted text-xs font-semibold tracking-wide uppercase">
            {{ group.title }}
          </span>
          @if (group.pass; as pass) {
            <span class="text-ink-muted font-mono text-xs">{{ pass }}</span>
          }
        </div>

        <div class="flex flex-wrap gap-1">
          @for (each of group.chips; track each.key) {
            <amk-command-chip
              [icon]="each.icon"
              [label]="each.label"
              [blurb]="each.blurb"
              [span]="each.span"
            />
          } @empty {
            <span class="text-ink-muted text-xs">{{ group.nothing }}</span>
          }
        </div>
      </div>
    }
  </div>
}

<amk-note-length [command]="command()" [pass]="pass()" />

@if (palette(); as palette) {
  <amk-note-palette [note]="command()" [model]="palette" />
}
