@if (unavailable(); as why) {
  <p class="text-ink-muted text-xs leading-relaxed">{{ why }}</p>
} @else {
  <div class="flex flex-col gap-1">
    <div class="flex items-baseline justify-between gap-3">
      <span class="text-ink-muted text-xs font-semibold tracking-wide uppercase">
        Commands acting on this note
      </span>
      @if (whichPass(); as pass) {
        <span class="text-ink-muted font-mono text-xs">{{ pass }}</span>
      }
    </div>

    <div class="flex flex-wrap gap-1">
      @for (each of acting(); track each.key) {
        <button
          type="button"
          class="border-edge bg-inset text-ink hover:border-accent flex cursor-pointer items-center gap-1.5 rounded-md border px-2 py-1 text-xs"
          [title]="each.blurb"
          (click)="reveal(each)"
        >
          <svg amk-glyph width="14" height="14" [name]="each.icon"></svg>
          {{ each.label }}
        </button>
      } @empty {
        <span class="text-ink-muted text-xs">Nothing but the note itself.</span>
      }
    </div>
  </div>
}

<amk-param-table [command]="command()" />
