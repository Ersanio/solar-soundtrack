@if (!written()) {
  <p
    i18n="@@inspector.quantization.needs-a-two-digit"
    class="text-ink-muted text-xs leading-relaxed"
  >
    inspector.quantization.needs-a-two-digit <code class="text-ink"></code>
  </p>
} @else {
  <amk-slider
    i18n-label="@@inspector.quantization.note-length.label"
    label="inspector.quantization.note-length.label"
    [value]="gateIndex()"
    [max]="7"
    [valueLabel]="gateLabel()"
    [note]="lockedBecause() ?? gateNote()"
    [disabled]="!editable()"
    (preview)="preview('gate', $event)"
    (commit)="setGate($event)"
  />

  <amk-slider
    i18n-label="@@inspector.quantization.velocity.label"
    label="inspector.quantization.velocity.label"
    [value]="velocityIndex()"
    [max]="15"
    [valueLabel]="velocityLabel()"
    [note]="velocityNote()"
    [disabled]="!editable()"
    (preview)="preview('velocity', $event)"
    (commit)="setVelocity($event)"
  />

  @if (outOfRange(); as problem) {
    <p class="text-warn text-xs leading-relaxed">{{ problem }}</p>
  }
}
