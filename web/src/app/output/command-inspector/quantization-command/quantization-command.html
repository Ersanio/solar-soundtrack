@if (!written()) {
  <p class="text-ink-muted text-xs leading-relaxed">
    Needs a two-digit hex value, as in <code class="text-ink">q7F</code>.
  </p>
} @else {
  <amk-slider
    label="Note length"
    [value]="gateIndex()"
    [max]="7"
    [valueLabel]="gateLabel()"
    [note]="lockedBecause() ?? gateNote()"
    [disabled]="!editable()"
    (preview)="preview('gate', $event)"
    (commit)="setGate($event)"
  />

  <amk-slider
    label="Velocity"
    [value]="velocityIndex()"
    [max]="15"
    [valueLabel]="velocityLabel()"
    [note]="velocityNote()"
    [disabled]="!editable()"
    (preview)="preview('velocity', $event)"
    (commit)="setVelocity($event)"
  />

  <p class="text-ink-muted text-xs leading-relaxed">{{ example() }}</p>

  @if (outOfRange(); as problem) {
    <p class="text-warn text-xs leading-relaxed">{{ problem }}</p>
  }
}
