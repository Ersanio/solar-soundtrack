@if (held() !== null) {
  <div
    class="border-warn/40 bg-warn/10 text-ink flex items-center justify-between gap-3 border-b px-4 py-2 text-sm"
  >
    <span i18n="@@error.held-song.the-editor-crashed-or-froze"
      >error.held-song.the-editor-crashed-or-froze</span
    >
    <div class="flex shrink-0 items-center gap-2">
      <button i18n="@@error.held-song.open" amk-button variant="primary" (click)="open()">
        error.held-song.open
      </button>
      <button i18n="@@error.held-song.download" amk-button (click)="download()">
        error.held-song.download
      </button>
      <button i18n="@@error.held-song.discard" amk-button variant="ghost" (click)="discard()">
        error.held-song.discard
      </button>
    </div>
  </div>
}
