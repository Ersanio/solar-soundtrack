<span [class]="dotClass()"></span>

<span class="font-mono" [class]="textClass()">{{ store.status().text }}</span>

<button
  type="button"
  class="cursor-pointer hover:underline"
  [class]="problemsClass()"
  (click)="requests.revealSection.set('problems')"
>
  <ng-container i18n="@@status.problems">{problemCount(), plural,
    =0 {status.problems}
    =1 {status.problems}
    other {status.problems {{ problemCount() // i18n(ph='count') }}}
  }</ng-container>
</button>

<button
  i18n="@@status.aram"
  type="button"
  class="cursor-pointer font-mono tabular-nums hover:underline"
  i18n-title="@@status.free-aram-opens-the.title"
  title="status.free-aram-opens-the.title"
  [class]="aramClass()"
  (click)="requests.revealSection.set('build')"
>
  status.aram
  {{
    store.freeLabel() // i18n(ph='free')
  }}
</button>

@if (notesLabel(); as label) {
  <span class="text-ink-muted font-mono tabular-nums">{{ label }}</span>
}

@if (rateLabel(); as label) {
  <span
    class="text-ink-muted font-mono tabular-nums"
    i18n-title="@@status.the-tempo-at-the.title"
    title="status.the-tempo-at-the.title"
    >{{ label }}</span
  >
}

<div class="ml-auto flex items-center gap-3">
  <span i18n="@@status.in-active-development-back" class="text-ink-muted"
    >status.in-active-development-back</span
  >

  <a
    i18n="@@status.made-by"
    href="https://ersan.io/"
    target="_blank"
    rel="noopener noreferrer"
    class="text-ink-muted hover:text-ink hover:underline"
    >status.made-by</a
  >
</div>
