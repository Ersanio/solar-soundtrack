@if (visible()) {
  <div
    role="status"
    aria-live="polite"
    class="border-accent/40 bg-accent/10 text-ink flex items-center justify-between gap-3 border-b px-4 py-2 text-sm"
  >
    <span>A new version is available. Reload to get the latest features and bugfixes.</span>
    <div class="flex items-center gap-2">
      <button amk-button variant="primary" (click)="reload()">Reload</button>
      <button
        amk-button
        variant="ghost"
        aria-label="Dismiss update notification"
        (click)="dismiss()"
      >
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true">
          <path
            d="M3 3l10 10M13 3L3 13"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
  </div>
}
