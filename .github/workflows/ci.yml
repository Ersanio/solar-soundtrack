name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # One install at the root covers every workspace: the four packages and
      # the Angular app.
      - run: npm ci

      - run: npm run lint

      # Formatting, three typechecks (packages, harnesses, app) and the eleven
      # byte-level harnesses: the compiler self-test, the scanner and its
      # splices, ADSR/instrument tables/BRR/echo FIR, the SPC assembly, the
      # headless MML -> SPC -> PCM audio chain, the worklet, and the chart
      # helpers.
      - run: npm run check

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    # Let a running deploy finish rather than cancelling it half-published.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # `npm run build` (not `ng build`) so the prebuild hook still bundles the
      # worklet, mirrors the SPC package's assets into web/public/ and writes
      # the commit SHA. None of the three is checked in.
      - name: Build
        working-directory: web
        run: npm run build -- --base-href=/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/solar-soundtrack/browser

      - id: deployment
        uses: actions/deploy-pages@v4
