<button
  amk-button
  variant="primary"
  [disabled]="!store.canCompile()"
  [attr.aria-label]="playback.isPlaying() ? 'Pause' : 'Compile and play'"
  (click)="playback.toggle()"
>
  {{ playback.isPlaying() ? '❚❚ Pause' : '▶ Play' }}
</button>

<button
  amk-button
  aria-label="Stop"
  title="Stop"
  [disabled]="playback.isIdle()"
  (click)="playback.stop()"
>
  ■
</button>

<!--
  Seeking on `change` rather than `input`: there is no snapshot to jump to, so
  the emulator replays the song silently to reach the new position. Firing on
  every drag event would queue a re-emulation per pixel.
-->
<input
  type="range"
  min="0"
  step="0.1"
  class="accent-accent w-24 cursor-pointer disabled:cursor-not-allowed disabled:opacity-40"
  aria-label="Seek"
  title="Seek — the song replays silently to reach the new position"
  [max]="playback.duration()"
  [value]="playback.elapsed()"
  [disabled]="!playback.canSeek()"
  (change)="onSeek($event)"
/>

<span class="text-ink-muted w-20 font-mono text-xs tabular-nums">
  {{ playback.timeLabel() }} / {{ playback.durationLabel() }}
</span>

<amk-checkbox
  [(checked)]="playback.live"
  title="While playing, reload the song at the same position whenever it recompiles"
>
  Live
</amk-checkbox>

<amk-checkbox [(checked)]="playback.loop" title="Restart the song when it reaches its end">
  Loop
</amk-checkbox>

<input
  type="range"
  min="0"
  max="500"
  class="accent-accent w-20 cursor-pointer"
  aria-label="Volume"
  title="Volume"
  [value]="playback.volume()"
  (input)="onVolume($event)"
/>
