<amk-panel heading="Source" class="min-h-0 flex-1">
  <span panelAside class="text-ink-muted font-mono text-xs">{{ store.caretLabel() }}</span>

  <textarea
    #area
    class="bg-surface text-ink h-full w-full resize-none border-0 p-3 font-mono text-[13px] leading-relaxed whitespace-pre focus:outline-none"
    spellcheck="false"
    autocomplete="off"
    autocapitalize="off"
    wrap="off"
    aria-label="MML source"
    [value]="store.source()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    (keyup)="syncCaret($event)"
    (click)="syncCaret($event)"
  ></textarea>
</amk-panel>

<amk-channel-mixer />
