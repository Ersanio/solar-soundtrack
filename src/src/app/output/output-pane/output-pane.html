<amk-panel heading="Output" class="min-h-0 flex-1">
  <span panelAside class="font-mono text-xs" [class]="statusColor()">
    {{ store.status().text }}
  </span>

  @if (blocked()) {
    <p class="text-danger m-3 text-xs leading-relaxed">
      Cannot compile without a driver — {{ drivers.loadError() ?? 'still loading…' }} The song's load
      address comes from the driver's song pointer table, so there is nothing to compile against.
    </p>
  } @else {
    <amk-stats-grid />
    <amk-aram-budget />

    <div class="border-edge border-b px-3 py-1.5">
      <h3 class="text-ink-muted text-xs font-semibold tracking-wide uppercase">Diagnostics</h3>
    </div>
    <amk-diagnostics-list />

    <amk-hex-dump />
  }
</amk-panel>
